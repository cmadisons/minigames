<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --board: #0f3460;
      --grid: #123a6b;
      --snake: #2ecc71;
      --snake-head: #57e08b;
      --food: #e94560;
      --text: #eaeaea;
      --accent: #e94560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    h1 { margin: 4px 0 12px; font-size: 1.8rem; }

    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }
    .stat {
      padding: 8px 20px;
      border-radius: 12px;
      background: #16213e;
      min-width: 110px;
    }
    .stat .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: #999; }
    .stat .value { font-size: 1.8rem; font-weight: bold; }
    #score-value { color: var(--snake); }
    #best-value { color: var(--food); }

    .wrap { position: relative; }
    canvas {
      background: var(--board);
      border-radius: 10px;
      display: block;
      max-width: 100%;
      height: auto;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 15, 35, 0.82);
      border-radius: 10px;
      gap: 12px;
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .overlay .big { font-size: 1.6rem; font-weight: bold; }
    .overlay .sub { color: #bbb; font-size: 0.95rem; max-width: 300px; line-height: 1.5; }

    .btn {
      padding: 12px 28px;
      font-size: 1.05rem;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
    .hint { color: #888; font-size: 0.85rem; margin-top: 14px; max-width: 460px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>🐍 Snake</h1>

  <div class="stats">
    <div class="stat">
      <div class="label">Score</div>
      <div class="value" id="score-value">0</div>
    </div>
    <div class="stat">
      <div class="label">Best</div>
      <div class="value" id="best-value">0</div>
    </div>
  </div>

  <div class="wrap">
    <canvas id="board" width="450" height="450"></canvas>
    <div class="overlay" id="overlay">
      <div class="big" id="over-title">🐍 Snake</div>
      <div class="sub" id="over-sub">Eat the food, grow longer, don't hit the walls or yourself.</div>
      <button class="btn" id="start">Start Game</button>
    </div>
  </div>

  <p class="hint">
    Move with <strong>Arrow keys</strong> or <strong>WASD</strong> (or swipe on touch).
    <strong>Space</strong> pauses. Eating food grows you and speeds things up a little.
  </p>

  <script>
    const GRID = 18;                 // 18 × 18 cells
    const CELL = 25;                 // pixel size per cell (canvas = 450)
    const START_LEN = 3;
    const START_MS = 140;            // tick delay at the start
    const MIN_MS = 70;               // fastest tick delay
    const SPEEDUP = 3;               // ms shaved off per food eaten
    const HS_KEY = "snake-highscore";

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score-value");
    const bestEl = document.getElementById("best-value");
    const overlay = document.getElementById("overlay");
    const overTitle = document.getElementById("over-title");
    const overSub = document.getElementById("over-sub");
    const startBtn = document.getElementById("start");

    let snake;        // array of {x, y}; head is index 0
    let dir;          // current direction {x, y}
    let nextDir;      // queued direction (applied on next tick)
    let food;         // {x, y}
    let score;
    let tickMs;
    let loopTimer;
    let running;
    let paused;

    function loadHigh() { return Number(localStorage.getItem(HS_KEY)) || 0; }

    function placeFood() {
      // pick a random empty cell
      let cell;
      do {
        cell = { x: rand(GRID), y: rand(GRID) };
      } while (snake.some(s => s.x === cell.x && s.y === cell.y));
      food = cell;
    }
    function rand(n) { return Math.floor(Math.random() * n); }

    function draw() {
      // background
      ctx.fillStyle = getCSS("--board");
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // subtle grid
      ctx.strokeStyle = getCSS("--grid");
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
      }

      // food
      drawCell(food.x, food.y, getCSS("--food"), true);

      // snake
      snake.forEach((s, idx) => {
        drawCell(s.x, s.y, idx === 0 ? getCSS("--snake-head") : getCSS("--snake"));
      });
    }
    function drawCell(x, y, color, round) {
      const pad = 2;
      ctx.fillStyle = color;
      const r = round ? 10 : 6;
      roundRect(x * CELL + pad, y * CELL + pad, CELL - pad * 2, CELL - pad * 2, r);
      ctx.fill();
    }
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    function getCSS(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function tick() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // wall or self collision → game over
      const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
      const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
      if (hitWall || hitSelf) return gameOver();

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        tickMs = Math.max(MIN_MS, tickMs - SPEEDUP);
        placeFood();
        restartLoop();
      } else {
        snake.pop(); // move forward: drop tail
      }

      draw();
    }

    function restartLoop() {
      clearInterval(loopTimer);
      loopTimer = setInterval(tick, tickMs);
    }

    function startGame() {
      const mid = Math.floor(GRID / 2);
      snake = [];
      for (let i = 0; i < START_LEN; i++) snake.push({ x: mid - i, y: mid });
      dir = { x: 1, y: 0 };
      nextDir = dir;
      score = 0;
      tickMs = START_MS;
      running = true;
      paused = false;
      scoreEl.textContent = "0";
      bestEl.textContent = loadHigh();
      placeFood();
      draw();
      overlay.classList.add("hidden");
      restartLoop();
    }

    function gameOver() {
      running = false;
      clearInterval(loopTimer);
      const best = loadHigh();
      let msg;
      if (score > best) {
        localStorage.setItem(HS_KEY, score);
        bestEl.textContent = score;
        msg = "🏆 New high score: " + score + "!";
      } else {
        msg = "Score: " + score + " · Best: " + best;
      }
      overTitle.textContent = "💀 Game Over";
      overSub.textContent = msg;
      startBtn.textContent = "Play Again";
      overlay.classList.remove("hidden");
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) {
        clearInterval(loopTimer);
        overTitle.textContent = "⏸ Paused";
        overSub.textContent = "Press Space or the button to resume.";
        startBtn.textContent = "Resume";
        overlay.classList.remove("hidden");
      } else {
        overlay.classList.add("hidden");
        restartLoop();
      }
    }

    // --- input ---
    function setDir(x, y) {
      // ignore reversing directly into yourself
      if (x === -dir.x && y === -dir.y) return;
      nextDir = { x, y };
    }
    const KEYS = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
      W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
    };
    document.addEventListener("keydown", e => {
      if (e.key === " ") { e.preventDefault(); if (running) togglePause(); return; }
      const move = KEYS[e.key];
      if (move) { e.preventDefault(); if (running && !paused) setDir(move[0], move[1]); }
    });

    startBtn.addEventListener("click", () => {
      if (paused) togglePause();     // resume
      else startGame();              // start / restart
    });

    // --- touch swipe ---
    let touchStart = null;
    canvas.addEventListener("touchstart", e => {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    canvas.addEventListener("touchmove", e => {
      if (!touchStart || !running || paused) return;
      const dx = e.touches[0].clientX - touchStart.x;
      const dy = e.touches[0].clientY - touchStart.y;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
      touchStart = null;
    }, { passive: true });

    // initial paint
    bestEl.textContent = loadHigh();
    snake = [{ x: 9, y: 9 }];
    food = { x: 4, y: 4 };
    dir = { x: 1, y: 0 };
    draw();
  </script>
</body>
</html>
