<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <style>
    /* --- the top ten, the same board Pac-Man and Doodle Jump show ------- */
    .scores { width: 100%; max-width: 360px; margin: 24px auto 0; }
    .scores h2 { font-size: .95rem; text-transform: uppercase; letter-spacing: 1px; color: #8890a6; margin-bottom: 10px; }
    #score-list { list-style: none; counter-reset: rank; padding: 0; margin: 0; }
    #score-list li {
      counter-increment: rank;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; margin-bottom: 5px;
      background: var(--card); border-radius: 9px; font-size: .94rem;
    }
    #score-list li::before {
      content: counter(rank); flex: none; width: 1.5rem; text-align: right;
      color: #8890a6; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    #score-list li:nth-child(1) { background: #2a2545; }
    #score-list li:nth-child(1)::before { content: "\1F947"; }
    #score-list li:nth-child(2)::before { content: "\1F948"; }
    #score-list li:nth-child(3)::before { content: "\1F949"; }
    #score-list .s { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
    #score-list .m { color: #8890a6; font-size: .82rem; }
    #score-list .d { margin-left: auto; color: #8890a6; font-size: .8rem; }
    #score-list li.empty { justify-content: center; color: #8890a6; }
    #score-list li.empty::before { content: ""; width: 0; }
    .scores .ghost { background: transparent; border: 1px solid #2a3a5e; color: #8890a6;
      border-radius: 9px; padding: 8px 14px; margin-top: 8px; cursor: pointer; font: inherit; }
    :root {
      --bg: #1a1a2e;
      --card: #16213e;
      --accent: #e94560;
      --text: #eaeaea;
      --win: #2ecc71;
      --lose: #e74c3c;
      --tie: #f1c40f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    h1 { margin-bottom: 8px; font-size: 2rem; }
    .subtitle { color: #9aa0b5; font-size: 0.95rem; margin-bottom: 18px; line-height: 1.5; }

    .scoreboard {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px;
    }
    .score-box {
      padding: 10px 18px; border-radius: 12px; background: #16213e; min-width: 92px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .score-box .label { font-size: 0.66rem; color: #8890a6; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .score-box .value { font-size: 1.7rem; font-weight: bold; line-height: 1.1; }
    #best-streak { color: #ffd23f; }

    .arena {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 16px;
      min-height: 120px;
    }
    .hand {
      font-size: 4rem;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      border-radius: 50%;
    }
    .vs { font-size: 1.4rem; color: #888; font-weight: bold; }

    .result {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 24px;
      min-height: 1.6rem;
    }
    .result.win { color: var(--win); }
    .result.lose { color: var(--lose); }
    .result.tie { color: var(--tie); }

    .choices { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .choice-btn {
      font-size: 2.5rem;
      width: 90px;
      height: 90px;
      border: 3px solid transparent;
      border-radius: 16px;
      background: var(--card);
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
    }
    .choice-btn:hover { transform: translateY(-4px); border-color: var(--accent); }
    .choice-btn:active { transform: translateY(0); }
    .choice-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; border-color: transparent; }
    .choice-btn.selected { border-color: var(--accent); background: #2a2a4a; }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    .hand.pop { animation: pop 0.25s ease; }

    .reset-btn {
      margin-top: 24px;
      padding: 10px 24px;
      font-size: 0.95rem;
      color: var(--text);
      background: transparent;
      border: 1px solid #555;
      border-radius: 8px;
      cursor: pointer;
    }
    .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <style>
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 52px;
      display: flex; align-items: center; gap: 12px; padding: 0 12px;
      background: rgba(22,33,62,0.95); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 1000;
    }
    .topbar .back {
      text-decoration: none; color: #eaeaea; font-size: 1.2rem; line-height: 1;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 7px 13px; flex-shrink: 0;
    }
    .topbar .back:hover { border-color: #e94560; }
    .topbar .tabs { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .topbar .tabs a {
      text-decoration: none; color: #b9b9c9; font-size: 0.9rem; white-space: nowrap;
      padding: 7px 12px; border-radius: 8px;
    }
    .topbar .tabs a:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .topbar .tabs a.active { background: #e94560; color: #fff; font-weight: 600; }
    body { padding-top: 68px; }
  </style>
  <nav class="topbar">
    <a class="back" href="index.html" title="Back to home">← Home</a>
  </nav>
  <h1>Rock Paper Scissors</h1>

  <div class="scoreboard">
    <div class="score-box">
      <span class="label">You</span>
      <span class="value" id="player-score">0</span>
    </div>
    <div class="score-box">
      <span class="label">Round</span>
      <span class="value" id="round-num">1</span>
    </div>
    <div class="score-box">
      <span class="label">Computer</span>
      <span class="value" id="computer-score">0</span>
    </div>
    <div class="score-box">
      <span class="label">Streak</span>
      <span class="value" id="streak">0</span>
    </div>
    <div class="score-box">
      <span class="label">Best</span>
      <span class="value" id="best-streak">0</span>
    </div>
  </div>

  <div class="result" id="result">Make your move!</div>

  <div class="arena">
    <div class="hand" id="player-hand">❓</div>
    <span class="vs">VS</span>
    <div class="hand" id="computer-hand">❓</div>
  </div>

  <div class="choices">
    <button class="choice-btn" data-choice="rock" title="Rock">✊</button>
    <button class="choice-btn" data-choice="paper" title="Paper">✋</button>
    <button class="choice-btn" data-choice="scissors" title="Scissors">✌️</button>
  </div>

  <button class="reset-btn" id="reset">New Match</button>

  <p class="subtitle">Best of 5 — first to 3 wins takes the match!</p>

  <section class="scores">
    <h2>🏆 Top 10 streaks</h2>
    <ol id="score-list"></ol>
    <button class="ghost" id="reset-scores">Reset high scores</button>
  </section>

  <script>
    const EMOJI = { rock: "✊", paper: "✋", scissors: "✌️" };
    // What each choice beats
    const BEATS = { rock: "scissors", paper: "rock", scissors: "paper" };
    const CHOICES = ["rock", "paper", "scissors"];
    const WINS_NEEDED = 3; // first to 3 wins the best-of-5 match

    let playerScore = 0;
    let computerScore = 0;
    let round = 1;
    let matchOver = false;

    // High score = your longest run of matches won in a row (kept across matches).
    const BEST_STREAK_KEY = "rps-best-streak";
    /*
      This was the only game in here that never wrote to the shared
      "records-<game>" list, which is the format the arcade menu reads -- so
      Rock Paper Scissors was invisible to it however well you did. It writes
      a record at the end of every match now: how long the streak got, and
      whether you were the one who ended it.
    */
    const HS_KEY = "records-rock-paper-scissors";
    function pushRecord(key, entry) {
      let a; try { a = JSON.parse(localStorage.getItem(key)) || []; } catch (e) { a = []; }
      a.push(entry); if (a.length > 50) a = a.slice(-50);
      try { localStorage.setItem(key, JSON.stringify(a)); } catch (e) { }
    }
    let streak = 0;
    let bestStreak = Number(localStorage.getItem(BEST_STREAK_KEY)) || 0;

    const playerHandEl = document.getElementById("player-hand");
    const computerHandEl = document.getElementById("computer-hand");
    const resultEl = document.getElementById("result");
    const playerScoreEl = document.getElementById("player-score");
    const computerScoreEl = document.getElementById("computer-score");
    const roundNumEl = document.getElementById("round-num");
    const streakEl = document.getElementById("streak");
    const bestStreakEl = document.getElementById("best-streak");
    const choiceBtns = document.querySelectorAll(".choice-btn");

    function updateStreakUI() {
      streakEl.textContent = streak;
      bestStreakEl.textContent = bestStreak;
    }
    updateStreakUI();

    function play(playerChoice) {
      if (matchOver) return;

      const computerChoice = CHOICES[Math.floor(Math.random() * 3)];

      playerHandEl.textContent = EMOJI[playerChoice];
      computerHandEl.textContent = EMOJI[computerChoice];

      // Visual feedback on every press: highlight the chosen button
      // and re-trigger the "pop" animation on both hands.
      choiceBtns.forEach(btn => {
        btn.classList.toggle("selected", btn.dataset.choice === playerChoice);
      });
      [playerHandEl, computerHandEl].forEach(el => {
        el.classList.remove("pop");
        void el.offsetWidth; // force reflow so the animation restarts each click
        el.classList.add("pop");
      });

      let outcome, cssClass;
      if (playerChoice === computerChoice) {
        outcome = "It's a tie — replay the round!";
        cssClass = "tie";
      } else if (BEATS[playerChoice] === computerChoice) {
        outcome = "You win the round! 🎉";
        cssClass = "win";
        playerScore++;
        round++;
      } else {
        outcome = "Computer wins the round! 🤖";
        cssClass = "lose";
        computerScore++;
        round++;
      }

      playerScoreEl.textContent = playerScore;
      computerScoreEl.textContent = computerScore;
      roundNumEl.textContent = round;

      // Check for match winner
      if (playerScore === WINS_NEEDED) {
        streak++;
        let extra = "";
        if (streak > bestStreak) {
          bestStreak = streak;
          localStorage.setItem(BEST_STREAK_KEY, bestStreak);
          extra = " 🏆 New best streak!";
        } else if (streak > 1) {
          extra = " (" + streak + " in a row!)";
        }
        updateStreakUI();
        endMatch("🏆 You won the match " + playerScore + "–" + computerScore + "!" + extra, "win");
      } else if (computerScore === WINS_NEEDED) {
        // The streak is only worth writing down once it is over, and it is
        // over now. A streak of nought is a loss with nothing behind it.
        if (streak > 0) {
          pushRecord(HS_KEY, { score: streak, date: Date.now(),
                               mode: streak === 1 ? "1 match" : streak + " matches" });
          renderScores();
        }
        streak = 0;
        updateStreakUI();
        endMatch("💻 Computer won the match " + computerScore + "–" + playerScore + "!", "lose");
      } else {
        resultEl.textContent = outcome;
        resultEl.className = "result " + cssClass;
      }
    }

    function endMatch(message, cssClass) {
      matchOver = true;
      roundNumEl.textContent = "—";
      resultEl.textContent = message;
      resultEl.className = "result " + cssClass;
      choiceBtns.forEach(btn => btn.disabled = true);
    }

    function newMatch() {
      playerScore = 0;
      computerScore = 0;
      round = 1;
      matchOver = false;
      playerScoreEl.textContent = "0";
      computerScoreEl.textContent = "0";
      roundNumEl.textContent = "1";
      playerHandEl.textContent = "❓";
      computerHandEl.textContent = "❓";
      resultEl.textContent = "Make your move!";
      resultEl.className = "result";
      choiceBtns.forEach(btn => {
        btn.disabled = false;
        btn.classList.remove("selected");
      });
    }

    choiceBtns.forEach(btn => {
      btn.addEventListener("click", () => play(btn.dataset.choice));
    });

    document.getElementById("reset").addEventListener("click", newMatch);

    // Keyboard support: r / p / s
    document.addEventListener("keydown", e => {
      const key = e.key.toLowerCase();
      if (key === "r") play("rock");
      else if (key === "p") play("paper");
      else if (key === "s") play("scissors");
    });
  
    function renderScores() {
      const list = document.getElementById("score-list");
      if (!list) return;
      let a; try { a = JSON.parse(localStorage.getItem(HS_KEY)) || []; } catch (e) { a = []; }
      a = a.filter(r => r && r.score > 0).sort((x, y) => y.score - x.score).slice(0, 10);
      if (!a.length) { list.innerHTML = '<li class="empty">No streaks yet \u2014 win a match!</li>'; return; }
      list.innerHTML = a.map(e =>
        '<li><span class="s">' + e.score + '</span>' +
        '<span class="m">' + (e.mode || "") + '</span>' +
        '<span class="d">' + new Date(e.date).toLocaleDateString() + '</span></li>'
      ).join("");
    }
    renderScores();
    document.getElementById("reset-scores").addEventListener("click", function () {
      if (!confirm("Erase all high scores? This can't be undone.")) return;
      try { localStorage.removeItem(HS_KEY); } catch (e) { }
      renderScores();
    });
  </script>
</body>
</html>
